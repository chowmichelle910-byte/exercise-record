<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運動紀錄 - WingA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .done { background-color: #F87171 !important; color: white; border: none; }
    </style>
</head>
<body class="bg-red-50 min-h-screen p-4 flex flex-col items-center">
    <div class="bg-white shadow-xl rounded-3xl p-6 w-full max-w-md">
        <nav class="flex justify-around mb-6 p-1 bg-gray-100 rounded-xl">
            <a href="index.html" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-500">All</a>
            <a href="WingA.html" class="px-4 py-2 rounded-lg text-sm font-bold bg-white shadow-sm text-red-500">WingA</a>
            <a href="WingC.html" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-500">WingC</a>
        </nav>
        <h2 id="monthDisplay" class="text-center text-xl font-bold text-gray-800 mb-4 tracking-wider">WingA 的進度</h2>
        <div id="calendarGrid" class="grid grid-cols-7 gap-2 text-center text-xs mb-4">
            </div>
        <button id="btn" onclick="checkIn()" class="w-full py-4 bg-red-500 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-all">
            確認今日打卡 (WingA)
        </button>
    </div>
    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycby1QmZXmllQO-JuCs5XWYOn3PIOiNy-mDtsO9Y5cJwyG7f2fnW0QiTnXp_TG14eez0Z/exec';
        let myDates = [];
        async function load() {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            myDates = data.WingA;
            render();
        }
        function render() {
            const grid = document.getElementById('calendarGrid');
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            grid.innerHTML = '';
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isDone = myDates.includes(dateStr);
                grid.innerHTML += `<div class="h-10 w-10 flex items-center justify-center rounded-full ${isDone ? 'done' : 'bg-gray-100'}">${d}</div>`;
            }
        }
        async function checkIn() {
            const dateStr = new Date().toISOString().split('T')[0];
            document.getElementById('btn').innerText = '處理中...';
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({date: dateStr, sheetName: 'WingA'}), mode: 'no-cors'});
            alert('WingA 打卡成功！');
            location.reload();
        }
        load();
    </script>
</body>
</html>
