<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運動紀錄 - All</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin: 1px; }
        .bg-winga { background-color: #64748b; } 
        .bg-wingc { background-color: #60A5FA; } 
        .calendar-day-box { min-height: 55px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; border: 1px solid #f1f5f9; }
        .today-mark { border: 2px solid #e2e8f0; background: white; }
        .today-text { font-weight: 900; color: #1e293b; text-decoration: underline; }
        /* 進度條動畫 */
        .bar-transition { transition: width 1s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 flex flex-col items-center">
    <div class="bg-white shadow-xl rounded-[2.5rem] p-6 w-full max-w-md">
        <nav class="flex justify-around mb-8 p-1.5 bg-gray-100 rounded-2xl text-sm font-bold">
            <a href="index.html" class="px-4 py-2 bg-white shadow-sm rounded-xl text-slate-800">All</a>
            <a href="WingA.html" class="px-4 py-2 text-gray-400 hover:text-slate-600 transition-all">WingA</a>
            <a href="WingC.html" class="px-4 py-2 text-gray-400 hover:text-slate-600 transition-all">WingC</a>
        </nav>

        <div class="flex justify-between items-center mb-6 px-4">
            <button onclick="changeMonth(-1)" class="text-gray-300 hover:text-slate-500 text-2xl transition-all">❮</button>
            <h2 id="monthDisplay" class="text-xl font-black text-slate-800 tracking-tight"></h2>
            <button onclick="changeMonth(1)" class="text-gray-300 hover:text-slate-500 text-2xl transition-all">❯</button>
        </div>

        <div class="grid grid-cols-7 gap-2 text-center text-[10px] font-black text-slate-300 mb-2 tracking-widest">
            <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
        </div>

        <div id="calendarGrid" class="grid grid-cols-7 gap-2 mb-8"></div>

        <div class="border-t border-slate-50 pt-6 space-y-5">
            <p class="text-[10px] font-black text-slate-300 uppercase tracking-[0.2em] text-center">Monthly Total (Minutes)</p>
            
            <div class="space-y-1">
                <div class="flex justify-between text-xs font-bold text-slate-500 px-1">
                    <span>WingA</span>
                    <span id="statA">0 min</span>
                </div>
                <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                    <div id="barA" class="bg-winga h-full bar-transition" style="width: 0%"></div>
                </div>
            </div>

            <div class="space-y-1">
                <div class="flex justify-between text-xs font-bold text-blue-500 px-1">
                    <span>WingC</span>
                    <span id="statC">0 min</span>
                </div>
                <div class="w-full bg-blue-50 h-3 rounded-full overflow-hidden">
                    <div id="barC" class="bg-wingc h-full bar-transition" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycby1QmZXmllQO-JuCs5XWYOn3PIOiNy-mDtsO9Y5cJwyG7f2fnW0QiTnXp_TG14eez0Z/exec';
        let currentViewDate = new Date();
        let allData = { WingA: [], WingC: [] };

        async function init() {
            try {
                const res = await fetch(GAS_URL);
                allData = await res.json();
                render();
            } catch (e) { 
                document.getElementById('monthDisplay').innerText = "載入失敗"; 
            }
        }

        function render() {
            const grid = document.getElementById('calendarGrid');
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            const monthStr = `${year}-${String(month + 1).padStart(2, '0')}`; // 用於過濾月份
            const todayStr = new Date().toLocaleDateString('en-CA');
            
            document.getElementById('monthDisplay').innerText = `${year}年 ${month + 1}月`;
            grid.innerHTML = '';

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;

            const aDates = allData.WingA ? allData.WingA.map(item => item.date) : [];
            const cDates = allData.WingC ? allData.WingC.map(item => item.date) : [];

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === todayStr;
                let dots = '';
                if (aDates.includes(dateStr)) dots += `<i class="dot bg-winga"></i>`;
                if (cDates.includes(dateStr)) dots += `<i class="dot bg-wingc"></i>`;

                grid.innerHTML += `
                    <div class="calendar-day-box ${isToday ? 'today-mark' : ''}">
                        <span class="text-[10px] mb-1 ${isToday ? 'today-text' : 'font-bold text-slate-300'}">${d}</span>
                        <div class="flex h-2 items-center justify-center gap-0.5">${dots}</div>
                    </div>`;
            }

            // --- 更新統計 Bar 邏輯 ---
            updateStats(monthStr);
        }

        function updateStats(monthStr) {
            // 過濾出本月資料並加總時長
            const totalA = allData.WingA
                .filter(item => item.date.startsWith(monthStr))
                .reduce((sum, item) => sum + parseInt(item.duration || 0), 0);
            
            const totalC = allData.WingC
                .filter(item => item.date.startsWith(monthStr))
                .reduce((sum, item) => sum + parseInt(item.duration || 0), 0);

            // 更新文字
            document.getElementById('statA').innerText = `${totalA} min`;
            document.getElementById('statC').innerText = `${totalC} min`;

            // 更新 Bar 長度 (假設每月目標為 600 分鐘，可自行調整比例)
            const goal = 600; 
            const percentA = Math.min((totalA / goal) * 100, 100);
            const percentC = Math.min((totalC / goal) * 100, 100);

            document.getElementById('barA').style.width = percentA + '%';
            document.getElementById('barC').style.width = percentC + '%';
        }

        function changeMonth(step) {
            currentViewDate.setMonth(currentViewDate.getMonth() + step);
            render();
        }

        init();
    </script>
</body>
</html>
