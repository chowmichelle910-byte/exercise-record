<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運動紀錄 - WingC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .done { background: #60A5FA !important; color: white !important; font-weight: bold; transform: scale(1.05); box-shadow: 0 4px 6px -1px rgba(96, 165, 250, 0.4); }
        .calendar-box { min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 0.875rem; transition: all 0.2s; }
        .today-mark { border: 2px solid #60A5FA; color: #60A5FA; }
    </style>
</head>
<body class="bg-blue-50 min-h-screen p-4 flex flex-col items-center">
    <div class="bg-white shadow-xl rounded-[2rem] p-6 w-full max-w-md">
        <nav class="flex justify-around mb-6 p-1 bg-gray-100 rounded-xl text-sm font-bold">
            <a href="index.html" class="px-4 py-2 text-gray-400">All</a>
            <a href="WingA.html" class="px-4 py-2 text-gray-400">WingA</a>
            <a href="WingC.html" class="px-4 py-2 bg-white shadow-sm rounded-lg text-blue-500">WingC</a>
        </nav>

        <h2 id="monthDisplay" class="text-center text-lg font-black text-gray-800 mb-6">讀取中...</h2>
        
        <div class="grid grid-cols-7 gap-2 text-center text-xs font-bold text-gray-400 mb-4">
            <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        
        <div id="calendarGrid" class="grid grid-cols-7 gap-2 mb-8"></div>

        <button id="btn" onclick="checkIn()" class="w-full py-4 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-2xl shadow-lg transition-all active:scale-95">
            確認今日打卡 (WingC)
        </button>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycby1QmZXmllQO-JuCs5XWYOn3PIOiNy-mDtsO9Y5cJwyG7f2fnW0QiTnXp_TG14eez0Z/exec';
        let myDates = [];

        async function init() {
            renderCalendar([]); 
            try {
                const res = await fetch(GAS_URL);
                const data = await res.json();
                myDates = data.WingC || [];
                console.log("WingC Data:", myDates);
                renderCalendar(myDates);
            } catch (e) {
                document.getElementById('monthDisplay').innerText = "載入失敗";
            }
        }

        function renderCalendar(doneDates) {
            const grid = document.getElementById('calendarGrid');
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const todayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            
            document.getElementById('monthDisplay').innerText = `${year}年 ${month + 1}月 (WingC)`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            grid.innerHTML = '';
            for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isDone = doneDates.includes(dateStr);
                const isToday = dateStr === todayStr;
                
                let classes = isDone ? 'done' : 'bg-gray-50 text-gray-400';
                if (isToday && !isDone) classes += ' today-mark';

                grid.innerHTML += `<div class="calendar-box ${classes}">${d}</div>`;
            }
        }

        async function checkIn() {
    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.innerText = '正在同步...';
    
    try {
        await fetch(GAS_URL, { 
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                // 不傳日期，讓 GAS 根據時區生成，確保最精準
                sheetName: 'WingC' 
            })
        });
        
        alert('打卡成功！');
        window.location.reload(); 
    } catch (error) {
        alert('連線失敗');
        btn.disabled = false;
        btn.innerText = '確認今日打卡';
    }
}

        init();
    </script>
</body>
</html>
